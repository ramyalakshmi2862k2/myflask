name: python-ci

on:
  push:
    branches: [ dev ]
 

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'   

    
      - name: Install dependencies
        run: |
          sudo apt install python3 python3-pip -y
          pip install -r requirements.txt
     
      - name: Run tests (pytest)
        run: pytest -q
