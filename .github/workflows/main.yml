name: python-ci

on:
  push:
    branches: 
      - feat/*
      - new_my1
 

jobs:
  build:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
           python-version: '3.12'
           cache: 'pip'


      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
     
      - name: Run tests (pytest)

        run: |
          pip install pytest 
          cd myflask
          pytest -q 

      - name : create Artifact
        run : |
          mkdir -p dist/flaskapp
          cp -r app.py dist/flaskapp/
          cp -r templates dist/flaskapp/
          cp requirements.txt dist/flaskapp/
          python -m venv .venv && source .venv/bin/activate
          pip install -r requirements.txt gunicorn
          cd dist && zip -r myflask.zip myflask

     
      - name: Upload artifact (ZIP)
        uses: actions/upload-artifact@v4
        with:
          name: myflask-artifact
          path: dist/myflask.zip
