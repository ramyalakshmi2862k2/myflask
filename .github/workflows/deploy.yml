    deploy :

      runs-on : ubuntu-latest
      needs: build
      steps:
        - name: Download build artifact
          uses: actions/download-artifact@v4
          with:
            name: myflask-artifact
            path: retrieved

        - name: Unzip
          run: |
             sudo apt-get update && sudo apt-get install -y unzip
             unzip retrieved/myflask-artifact.zip -d out
            ls -la out/myflask